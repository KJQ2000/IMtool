{% extends 'base.html' %}

{% block title %}
<title>Add New Stock</title>
{% endblock %}

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-+0n0xVW2eSR5OomGNYDnhzAbDsOXxcvSN1TPprVMTNDbiYZCxYbOOl7+AMvyTG2x" crossorigin="anonymous">

{% block content %}
<main>
    <div class="container-fluid mt-4">
        <h1 class="mb-4">Add New Stock</h1>
        
        <div class="mb-3">
            <a class="btn btn-secondary me-2" href="/stocks">Back to Stocks List</a>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <form method="POST" action="/add-stock">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="stk_gold_type" class="form-label">Stock Gold Type</label>
                            <input type="text" class="form-control" id="stk_gold_type" name="stk_gold_type" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="stk_type" class="form-label">Stock Type</label>
                            <input type="text" class="form-control" id="stk_type" name="stk_type" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="stk_pattern" class="form-label">Stock Pattern</label>
                            <input type="text" class="form-control" id="stk_pattern" name="stk_pattern" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="stk_weight" class="form-label">Stock Weight</label>
                            <input type="number" step="0.01" class="form-control" id="stk_weight" name="stk_weight" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="stk_size" class="form-label">Stock Size</label>
                            <input type="text" class="form-control" id="stk_size" name="stk_size">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="stk_length" class="form-label">Stock Length</label>
                            <input type="number" step="0.01" class="form-control" id="stk_length" name="stk_length">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="stk_labor_cost" class="form-label">Stock Labor Cost</label>
                            <input type="number" step="0.01" class="form-control" id="stk_labor_cost" name="stk_labor_cost" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="stk_labor_sell" class="form-label">Stock Labor Sell</label>
                            <input type="number" step="0.01" class="form-control" id="stk_labor_sell" name="stk_labor_sell">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="stk_pur_date" class="form-label">Stock Purchase Date</label>
                            <input type="date" class="form-control" id="stk_pur_date" name="stk_pur_date" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="stk_sell_date" class="form-label">Stock Sell Date</label>
                            <input type="date" class="form-control" id="stk_sell_date" name="stk_sell_date">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="stk_gold_cost" class="form-label">Stock Gold Cost</label>
                            <input type="number" step="0.01" class="form-control" id="stk_gold_cost" name="stk_gold_cost" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="stk_gold_sell" class="form-label">Stock Gold Sell</label>
                            <input type="number" step="0.01" class="form-control" id="stk_gold_sell" name="stk_gold_sell">
                        </div>
                        <select class="form-select custom-dropdown" id="stk_status" name="stk_status" required>
                            <option value="" disabled selected>Select Status</option>
                            <option value="IN STOCK">IN STOCK</option>
                            <option value="SOLD">SOLD</option>
                            <option value="BOOKED">BOOKED</option>
                        </select>
                        <style>
                            .custom-dropdown {
                                background-color: #f8f9fa; /* Light background color */
                                border: 1px solid #ced4da; /* Border color */
                                border-radius: 0.375rem; /* Border radius for rounded corners */
                                padding: 0.375rem 0.75rem; /* Padding for better spacing */
                                font-size: 1rem; /* Font size */
                                color: #495057; /* Text color */
                                transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out; /* Smooth transition for focus state */
                            }
                            
                            .custom-dropdown:focus {
                                border-color: #007bff; /* Border color on focus */
                                box-shadow: 0 0 0 0.2rem rgba(38, 143, 255, 0.25); /* Shadow color on focus */
                            }
                            
                            .custom-dropdown option {
                                background-color: #fff; /* Background color for options */
                                color: #495057; /* Text color for options */
                            }
                        </style>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="stk_profit" class="form-label">Stock Profit</label>
                            <input type="number" step="0.01" class="form-control" id="stk_profit" name="stk_profit">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Stock</button>
                </form>
            </div>
        </div>
    </div>
</main>
{% endblock %}
