{% extends 'base.html' %}

{% block title %}
<title>Add New Customer</title>
{% endblock %}

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-+0n0xVW2eSR5OomGNYDnhzAbDsOXxcvSN1TPprVMTNDbiYZCxYbOOl7+AMvyTG2x" crossorigin="anonymous">

{% block content %}
<main>
    <div class="container-fluid mt-4">
        <h1 class="mb-4">Add New Customer</h1>
        
        <div class="mb-3">
            <a class="btn btn-secondary" href="/customers">Back to Customers List</a>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <form method="POST" action="/add-customer">

                    <div class="mb-4">
                        <h5 class="card-title">Customer Details</h5>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="cust_buyer_id" class="form-label">Customer Identification No</label>
                                <input type="text" class="form-control" id="cust_buyer_id" name="cust_buyer_id">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="cust_name" class="form-label">Customer Name</label>
                                <input type="text" class="form-control" id="cust_name" name="cust_name" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="cust_phone_number" class="form-label">Customer Phone Number</label>
                                <input type="text" class="form-control" id="cust_phone_number" name="cust_phone_number">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="cust_email_address" class="form-label">Customer Email</label>
                                <input type="text" class="form-control" id="cust_email_address" name="cust_email_address">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="cust_address" class="form-label">Customer Address</label>
                                <textarea class="form-control" id="cust_address" name="cust_address" rows="3"></textarea>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="cust_sst_reg_no" class="form-label">Customer SST Reg No</label>
                                <input type="text" class="form-control" id="cust_sst_reg_no" name="cust_sst_reg_no">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="cust_tin" class="form-label">Customer TIN No</label>
                                <input type="text" class="form-control" id="cust_tin" name="cust_tin">
                            </div>
                        </div>
                        

                    <button type="submit" class="btn btn-primary">Add Customer</button>
                </form>
            </div>
        </div>
    </div>
</main>

{% endblock %}
