{% extends 'base.html' %}

{% block title %}
<title>Update Pattern</title>
{% endblock %}

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-+0n0xVW2eSR5OomGNYDnhzAbDsOXxcvSN1TPprVMTNDbiYZCxYbOOl7+AMvyTG2x" crossorigin="anonymous">

{% block content %}
<main>
    <div class="container-fluid mt-4">
        <h1 class="mb-4">Update Pattern</h1>
        
        <div class="mb-3">
            <a class="btn btn-secondary" href="/patterns">Back to Patterns List</a>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <form method="POST" action="/updatepattern" enctype="multipart/form-data">
                    <div class="mb-4" id="pattern-details-section">
                        <h5 class="card-title">Pattern Details</h5>
                        <!-- <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="category" class="form-label">Category Type</label>
                                <select class="form-select" id="cpat_category" name="cpat_category" readonly>
                                    <option value="" disabled>Select Type</option>
                                    <option value="RING" {% if pattern.cpat_category == 'RING' %}selected{% endif %}>Ring</option>
                                    <option value="BRACELET" {% if pattern.cpat_category == 'BRACELET' %}selected{% endif %}>Bracelet</option>
                                    <option value="BANGLE" {% if pattern.cpat_category == 'BANGLE' %}selected{% endif %}>Bangle</option>
                                    <option value="NECKLACE" {% if pattern.cpat_category == 'NECKLACE' %}selected{% endif %}>Necklace</option>
                                    <option value="EARING" {% if pattern.cpat_category == 'EARING' %}selected{% endif %}>Earing</option>
                                    <option value="PENDANT" {% if pattern.cpat_category == 'PENDANT' %}selected{% endif %}>Pendant</option>
                                    <option value="ANKLET" {% if pattern.cpat_category == 'ANKLET' %}selected{% endif %}>Anklet</option>
                                </select>
                            </div>
                        </div> -->
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="category" class="form-label">Category Type</label>
                                <input type="text" class="form-control" id="cpat_category" name="cpat_category" value="{{ pattern.cpat_category }}" readonly>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="pattern" class="form-label">Pattern Name</label>
                                <input type="text" class="form-control" id="cpat_pattern" name="cpat_pattern" value="{{ pattern.cpat_pattern }}" readonly>
                            </div>
                        </div>
                        <div class="row">
                          <div class="col-md-4 mb-3" id="image-section">
                              <!-- <label for="image" class="form-label">Upload Pattern Image:</label>
                              <input type="file" accept="image/*" id="image" name="image" required>  -->
                              <label for="image" class="form-label">Upload Pattern Image:</label>
    
                              {% if pattern.cpat_image_path %}
                              <!-- Display existing image if available -->
                              <img src="{{ pattern.cpat_image_path }}" alt="Pattern Image" class="img-fluid mb-2" id="image">
                              <br> 
                              <small>Current Image</small>
                              {% endif %}
                              
                              <input type="file" accept="image/*" id="cpat_image_path" name="cpat_image_path" value="{{ pattern.cpat_image_path }}">
                          </div>
                      </div>
                    </div>
                    <div class="col-md-6 mb-3" id="cpat_id-section">
                        <!-- <label for="cpat_id" class="form-label">Pattern ID</label> -->
                        <input type="hidden" class="form-control" id="cpat_id" name="cpat_id" value="{{ pattern.cpat_id }}">
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Update Pattern</button>
                </form>
            </div>
        </div>
    </div>
</main>

{% endblock %}
