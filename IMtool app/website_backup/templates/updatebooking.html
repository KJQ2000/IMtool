{% extends 'base.html' %}

{% block title %}
<title>Update Booking</title>
{% endblock %}

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-+0n0xVW2eSR5OomGNYDnhzAbDsOXxcvSN1TPprVMTNDbiYZCxYbOOl7+AMvyTG2x" crossorigin="anonymous">

{% block content %}
<main>
    <div class="container-fluid mt-4">
        <h1 class="mb-4">Update Booking</h1>
        
        <div class="mb-3">
            <a class="btn btn-secondary" href="/bookings">Back to Booking List</a>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <form method="POST" action="/update-booking/{{ booking.book_id }}">

                    <!-- Booking Details Section -->
                    <div class="mb-4">
                        <h5 class="card-title">Booking Details</h5>
                        <div class="row">
                            <div class="col-md-12 mb-3">
                                <label for="book_cust_id" class="form-label">Customer</label>
                                <select class="form-select" id="book_cust_id" name="book_cust_id" required>
                                    <option value="" disabled>Select Customer</option>
                                    {% for customer in customers %}
                                        <option value="{{ customer.cust_id }}" {% if customer.cust_id == booking.book_cust_id %}selected{% endif %}>{{ customer.cust_name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="book_receipt_no" class="form-label">Booking Receipt No</label>
                                <input type="text" class="form-control" id="book_receipt_no" name="book_receipt_no" value="{{ booking.book_receipt_no }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="book_date" class="form-label">Booking Date</label>
                                <input type="date" class="form-control" id="book_date" name="book_date" value="{{ booking.book_date }}" required>
                            </div>
                        </div>
                    </div>

                    <!-- Costs Section -->
                    <!-- <div class="mb-4">
                        <h5 class="card-title">Booking Costs</h5>
                        <div class="row">
                            
                            <div class="col-md-6 mb-3">
                                <label for="book_price" class="form-label">Total Price</label>
                                <input type="number" step="0.01" class="form-control" id="book_price" name="book_price" value="{{ booking.book_price }}" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="bp_payment" class="form-label">Deposit Amount</label>
                                <input type="number" step="0.01" class="form-control" id="bp_payment" name="bp_payment" value="{{ booking.bp_payment }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="book_remaining" class="form-label">Remaining Amount</label>
                                <input type="number" step="0.01" class="form-control" id="book_remaining" name="book_remaining" value="{{ booking.book_remaining }}" readonly>
                            </div>
                        </div>
                    </div> -->
                    <!-- Stock Sale Entry -->
                    <h5 class="card-title">Stock Book Entry</h5>
                    <table id="stockTable" border="1">
                        <thead>
                            <tr>
                                <th>Stock Id</th>
                                <th>Gold Price</th>
                                <th>Labor Price</th>
                                <th>Weight (g)</th>
                                <th>Total</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for stock_entry in stock_entries %}
                            <tr>
                                <td>
                                    <input type="text" onkeyup="filterStockList(this)" placeholder="Search for stock ID..." 
                                        class="stock-search">
                                    <select name="stk_id" required>
                                        <option value="">Select Stock</option>
                                        {% for stock in stocks %}
                                            <option value="{{ stock.stk_id }}" {% if stock.stk_id == stock_entry.stk_id %}selected{% endif %}>{{ stock.stk_id }}</option>
                                        {% endfor %}
                                    </select>
                                </td>
                                <td><input type="number" name="stk_gold_book" value="{{ stock_entry.stk_gold_book }}" required oninput="calculateLaborPrice(this)"></td>
                                <td><input type="number" name="stk_labor_book" value="{{ stock_entry.stk_labor_book }}" required readonly></td>
                                <td><input type="number" step="0.01" name="stk_weight_book" value="{{ stock_entry.stk_weight_book }}" required oninput="calculateLaborPrice(this)"></td>
                                <td><input type="number" step="0.01" name="stk_book_price" value="{{ stock_entry.stk_book_price }}" required oninput="calculateLaborPrice(this)"></td>
                                <td><button type="button" onclick="removeStockEntry(this)">Remove</button></td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                
                    <button type="button" onclick="addStockEntry()">Add Stock</button>
                    <br><br>

                    <button type="submit" class="btn btn-primary">Update Booking</button>
                </form>
            </div>
        </div>
    </div>
</main>

<script>
    // Function to calculate remaining amount
    function calculateRemaining() {
        const totalPrice = parseFloat(document.getElementById('book_price').value) || 0;
        const depositAmount = parseFloat(document.getElementById('bp_payment').value) || 0;
        const remainingAmount = totalPrice - depositAmount;
        document.getElementById('book_remaining').value = remainingAmount >= 0 ? remainingAmount : 0;
    }

    // Event listeners for calculating remaining amount
    document.getElementById('book_price').addEventListener('input', calculateRemaining);
    document.getElementById('bp_payment').addEventListener('input', calculateRemaining);

    function calculateLaborPrice(inputElement) {
        const row = inputElement.closest('tr');
        const goldPrice = parseFloat(row.querySelector('input[name="stk_gold_book"]').value) || 0;
        const weight = parseFloat(row.querySelector('input[name="stk_weight_book"]').value) || 0;
        const totalPrice = parseFloat(row.querySelector('input[name="stk_book_price"]').value) || 0;
        
        const laborPrice = totalPrice - (weight * goldPrice);
        row.querySelector('input[name="stk_labor_book"]').value = laborPrice.toFixed(2);
    }

    // Function to calculate the total price from all rows in the stock table
    function calculateTotalFromTable() {
        const rows = document.querySelectorAll('#stockTable tbody tr');
        let total = 0;

        // Loop through each row and sum the total price (column 5, index 4)
        rows.forEach(row => {
            const salePrice = parseFloat(row.querySelector('input[name="stk_book_price"]').value) || 0;
            total += salePrice;
        });

        // Update the total price field with the calculated total
        document.getElementById('book_price').value = total.toFixed(2);
        calculateRemaining(); // Update the remaining amount as well
    }

    document.getElementById('stockTable').addEventListener('input', function(e) {
        if (e.target.matches('input[name="stk_book_price"]')) {
            calculateTotalFromTable(); 
        }
    });

    function addStockEntry() {
        const table = document.getElementById("stockTable");
        const row = table.insertRow(table.rows.length);

        const cell1 = row.insertCell(0);
        const cell2 = row.insertCell(1);
        const cell3 = row.insertCell(2);
        const cell4 = row.insertCell(3);
        const cell5 = row.insertCell(4);
        const cell6 = row.insertCell(5);

        cell1.innerHTML = `
            <input type="text" onkeyup="filterStockList(this)" placeholder="Search for stock ID..." 
                id="searchStock${row.rowIndex}" class="stock-search">
            <select name="stk_id" required id="stockSelect${row.rowIndex}">
                <option value="">Select Stock</option>
                {% for stock in stocks %}
                    <option value="{{ stock.stk_id }}">{{ stock.stk_id }}</option>
                {% endfor %}
            </select>
        `;
        cell2.innerHTML = `<input type="number" name="stk_gold_book" required oninput="calculateLaborPrice(this)">`;
        cell3.innerHTML = `<input type="number" name="stk_labor_book" required readonly>`;
        cell4.innerHTML = `<input type="number" step="0.01" name="stk_weight_book" required oninput="calculateLaborPrice(this)">`;
        cell5.innerHTML = `<input type="number" step="0.01" name="stk_book_price" required oninput="calculateLaborPrice(this)">`;
        cell6.innerHTML = `<button type="button" onclick="removeStockEntry(this)">Remove</button>`;
    }

    // Function to filter stock list based on input
    function filterStockList(inputElement) {
        const filter = inputElement.value.toUpperCase();
        const select = inputElement.nextElementSibling;
        const options = select.getElementsByTagName("option");

        // Loop through all options and hide those that don't match the search
        for (let i = 0; i < options.length; i++) {
            const option = options[i];
            if (option.innerHTML.toUpperCase().indexOf(filter) > -1) {
                option.style.display = "";
            } else {
                option.style.display = "none";
            }
        }
    }

    function removeStockEntry(button) {
        const row = button.closest('tr');
        row.remove();
    }
</script>

{% endblock %}
