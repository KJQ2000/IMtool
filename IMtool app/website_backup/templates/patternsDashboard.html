<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Patterns</title>
  <style>
    /* Basic CSS to style the page */
    body {
      font-family: Arial, sans-serif;
      background-image: url('/static/pattern/goldbackground1.jpg'); /* Replace with your image URL */
      background-size: cover;  /* Ensures the image covers the entire page */
      background-position: center; /* Centers the background image */
      background-attachment: fixed; /* Keeps the image fixed when scrolling */
      margin: 0;
      padding: 20px;
    }
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%; /* Ensures the overlay covers the full height */
      background-color: rgba(0, 0, 0, 0.5); /* Darkens the background */
      z-index: -1; /* Places the overlay behind the content */
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .patterns-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }
    .pattern-item {
      position: relative;
      width: 200px;
      height: 200px;
      overflow: hidden;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    .pattern-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }
    .pattern-item:hover img {
      transform: scale(1.05);
    }
    .pattern-item h3 {
      position: absolute;
      bottom: 10px;
      left: 10px;
      color: white;
      background-color: rgba(0, 0, 0, 0.6);
      padding: 5px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <h1 style="border-radius: 10px; background: rgba(255, 255, 255, 0.6)">Stock Pattern Gallery</h1>

  <!-- Grid for displaying stock patterns -->
  <div class="patterns-grid">
    {% for pattern in patterns %} 
    <form id="view-pattern-{{ pattern.cpat_pattern }}" action="/stocks/{{ pattern.cpat_category }}/{{ pattern.cpat_pattern }}" method="post" style="display: inline;">
      <div class="pattern-item" onclick="goToStockPage('{{ pattern.cpat_pattern }}')"> 
        <img src="{{ pattern.cpat_image_path }}" alt="{{ pattern.cpat_pattern }}">
        <h3>{{ pattern.cpat_pattern }}</h3>
      </div>
    </form>
    {% endfor %}
  </div>
  <script>
    // Function to redirect to the respective stock page when an image is clicked
    function goToStockPage(pattern) {
      document.getElementById('view-pattern-' + pattern).submit();
      // window.location.href = `${pattern}`; // Redirect to a page with stock data for the selected pattern
    }

  </script>

</body>
</html>
