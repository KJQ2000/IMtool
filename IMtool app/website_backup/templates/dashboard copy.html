<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Patterns</title>
  <style>
    /* Basic CSS to style the page */
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .patterns-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }
    .pattern-item {
      position: relative;
      width: 200px;
      height: 200px;
      overflow: hidden;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    .pattern-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }
    .pattern-item:hover img {
      transform: scale(1.05);
    }
    .pattern-item h3 {
      position: absolute;
      bottom: 10px;
      left: 10px;
      color: white;
      background-color: rgba(0, 0, 0, 0.6);
      padding: 5px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <h1>Stock Pattern Gallery</h1>

  <!-- Grid for displaying stock patterns -->
  <div class="patterns-grid">
    <!-- Pattern 1 -->
    <div class="pattern-item" onclick="goToStockPage('pattern1')">
      <img src="./static/img/goldnecklace.jpg" alt="Pattern 1">
      <h3>Pattern 1</h3>
    </div>

    <!-- Pattern 2 -->
    <div class="pattern-item" onclick="goToStockPage('pattern2')">
      <img src="pattern2.jpg" alt="Pattern 2">
      <h3>Pattern 2</h3>
    </div>

    <!-- Pattern 3 -->
    <div class="pattern-item" onclick="goToStockPage('pattern3')">
      <img src="pattern3.jpg" alt="Pattern 3">
      <h3>Pattern 3</h3>
    </div>

    <!-- Add more patterns as needed -->
  </div>

  <script>
    // Function to redirect to the respective stock page when an image is clicked
    function goToStockPage(pattern) {
      window.location.href = `${pattern}`; // Redirect to a page with stock data for the selected pattern
    }
  </script>

</body>
</html>
