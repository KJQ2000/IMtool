<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap/styles.css')}}">
    <link href="https://cdn.datatables.net/1.10.20/css/dataTables.bootstrap4.min.css" rel="stylesheet" crossorigin="anonymous" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.0/js/all.min.js" crossorigin="anonymous"></script>
    {% block title%}{% endblock %}
    <style>
        /* Include the sidebar collapse styles here or in your CSS file */
        #layoutSidenav_nav {
            transition: margin-left .3s;
        }
        #layoutSidenav_nav.sidenav-collapsed {
            margin-left: -250px; /* Adjust this value to match your sidebar width */
        }
        #layoutSidenav_content {
            transition: margin-left .3s;
        }
        #layoutSidenav_content.sidenav-collapsed {
            margin-left: 0;
        }
    </style>
</head>
<body class="sb-nav-fixed">
    <nav class="sb-topnav navbar navbar-expand navbar-dark bg-dark">
        <button class="btn btn-link btn-sm order-1 order-lg-0" id="sidebarToggle"><i class="fas fa-bars"></i></button>
        <a class="navbar-brand" href="/">Inventory Management App</a>
    </nav>
    <div id="layoutSidenav">
        <div id="layoutSidenav_nav">
            <nav class="sb-sidenav accordion sb-sidenav-dark" id="sidenavAccordion">
                <div class="sb-sidenav-menu">
                    <div class="nav">
                        <div class="sb-sidenav-menu-heading">Core</div>
                        <a class="nav-link" href="/stocks">
                            <div class="sb-nav-link-icon"><i class="fas fa-tachometer-alt"></i></div>
                            Stocks
                        </a>
                        <div class="sb-sidenav-menu-heading">Transactions</div>
                        <a class="nav-link" href="/purchases">
                            <div class="sb-nav-link-icon"><i class="fas fa-chart-area"></i></div>
                            Purchases
                        </a>
                        <a class="nav-link" href="/sales">
                            <div class="sb-nav-link-icon"><i class="fas fa-table"></i></div>
                            Sales
                        </a>
                        <a class="nav-link" href="/bookings">
                            <div class="sb-nav-link-icon"><i class="fas fa-table"></i></div>
                            Bookings
                        </a>
                        <div class="sb-sidenav-menu-heading">User Management</div>
                        <a class="nav-link" href="/customers">
                          <div class="sb-nav-link-icon"><i class="fa fa-address-card"></i></div>
                          Customers
                        </a>
                        <a class="nav-link" href="/salesmans">
                          <div class="sb-nav-link-icon"><i class="fas fa-tachometer-alt"></i></div>
                          Salesmans
                        </a>
                        <a class="nav-link" href="/users">
                            <div class="sb-nav-link-icon"><i class="fas fa-tachometer-alt"></i></div>
                            Users
                        </a>
                    </div>
                </div>
            </nav>
        </div>
        <div id="layoutSidenav_content">
            {% block content %}
            {% endblock %}
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js" crossorigin="anonymous"></script>
    <script src="{{ url_for('static', filename='js/bootstrap/scripts.js')}}"></script>
    <script src="https://cdn.datatables.net/1.10.20/js/jquery.dataTables.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.datatables.net/1.10.20/js/dataTables.bootstrap4.min.js" crossorigin="anonymous"></script>
    <script src="{{ url_for('static', filename='js/datatables-demo.js')}}"></script>
    <script src="{{ url_for('static', filename='js/script.js')}}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const sidebarToggle = document.getElementById('sidebarToggle');
            const sidebar = document.getElementById('layoutSidenav_nav');
            const content = document.getElementById('layoutSidenav_content');

            sidebarToggle.addEventListener('click', function() {
                sidebar.classList.toggle('sidenav-collapsed');
                content.classList.toggle('sidenav-collapsed');
            });
        });
    </script>
</body>
</html>
